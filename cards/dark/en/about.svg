<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" role="img" aria-label="About me: Full stack developer since 2023, working day to day with .NET, React and Node.js on end-to-end web applications. I build REST APIs, integrate systems and work with data in relational databases. I ship with tests and code review, with performance, security and maintainability in mind."><title>About me: Full stack developer since 2023, working day to day with .NET, React and Node.js on end-to-end web applications. I build REST APIs, integrate systems and work with data in relational databases. I ship with tests and code review, with performance, security and maintainability in mind.</title><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="4.5" y="4.5" width="871" height="357" rx="14" fill="#000000" stroke="rgba(255,255,255,.11)"/><text x="44" y="62" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#f4f4f5" xml:space="preserve">About me</text><text x="44" y="106" font-size="17" fill="#a1a1aa" xml:space="preserve">Full stack developer since 2023, working day to day</text><text x="44" y="134" font-size="17" fill="#a1a1aa" xml:space="preserve">with .NET, React and Node.js on end-to-end web</text><text x="44" y="162" font-size="17" fill="#a1a1aa" xml:space="preserve">applications. I build REST APIs, integrate systems and</text><text x="44" y="190" font-size="17" fill="#a1a1aa" xml:space="preserve">work with data in relational databases. I ship with tests</text><text x="44" y="218" font-size="17" fill="#a1a1aa" xml:space="preserve">and code review, with performance, security and</text><text x="44" y="246" font-size="17" fill="#a1a1aa" xml:space="preserve">maintainability in mind.</text><text x="548" y="62" font-size="11.5" class="m" fill="#8b8b94" xml:space="preserve">stack</text><text x="548" y="84" font-size="14" fill="#f4f4f5" xml:space="preserve">C#, VB.NET, JavaScript, TypeScript, SQL</text><rect x="548" y="106" width="288" height="1" fill="rgba(255,255,255,.08)"/><text x="548" y="124" font-size="11.5" class="m" fill="#8b8b94" xml:space="preserve">focus</text><text x="548" y="146" font-size="14" fill="#f4f4f5" xml:space="preserve">REST APIs, ERP integration (SAP) and SQL</text><text x="548" y="166" font-size="14" fill="#f4f4f5" xml:space="preserve">Server</text><rect x="548" y="188" width="288" height="1" fill="rgba(255,255,255,.08)"/><text x="548" y="206" font-size="11.5" class="m" fill="#8b8b94" xml:space="preserve">practices</text><text x="548" y="228" font-size="14" fill="#f4f4f5" xml:space="preserve">Integration testing, code review, Git and</text><text x="548" y="248" font-size="14" fill="#f4f4f5" xml:space="preserve">Azure DevOps</text><rect x="548" y="270" width="288" height="1" fill="rgba(255,255,255,.08)"/><text x="548" y="288" font-size="11.5" class="m" fill="#8b8b94" xml:space="preserve">based in</text><text x="548" y="310" font-size="14" fill="#f4f4f5" xml:space="preserve">Porto Alegre, BR · UTC-3</text></svg>
